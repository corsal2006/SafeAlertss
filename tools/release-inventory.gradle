import groovy.json.JsonOutput

allprojects {
    afterEvaluate { project ->
        if (project.path == ':app') {
            project.tasks.register('releaseDependencyInventory') {
                doLast {
                    def modules = project.configurations.releaseRuntimeClasspath.resolvedConfiguration.resolvedArtifacts
                        .collect { artifact ->
                            def id = artifact.moduleVersion.id
                            [package: [ecosystem: 'Maven', name: "${id.group}:${id.name}".toString()], version: id.version]
                        }.unique().sort { a, b -> a.package.name <=> b.package.name }
                    def output = project.rootProject.file('build/release-dependencies.json')
                    output.parentFile.mkdirs()
                    output.text = JsonOutput.prettyPrint(JsonOutput.toJson(modules))
                    println "Resolved ${modules.size()} release dependencies; inventory: ${output}"
                }
            }
        }
    }
}
